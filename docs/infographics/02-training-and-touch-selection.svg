<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1700" viewBox="0 0 1400 1700"><title>How training and touch selection work</title><desc>Latest tested implementation: touch-direct-20260912 · experimental · not the configured UI default</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#527985"/></marker><marker id="b" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#AC6826"/></marker></defs><rect width="1400" height="1700" fill="#F7F5EF"/><text x="70" y="61" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#526A70" text-anchor="start">MALECNS / REBOT     02 OF 03</text><text x="70" y="125" font-family="Arial, sans-serif" font-size="47" font-weight="700" fill="#14343C" text-anchor="start">How training and touch selection work</text><text x="70" y="165.0" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#526A70" text-anchor="start">Latest tested implementation: touch-direct-20260912 · experimental · not the configured UI default</text><rect x="70" y="215" width="490" height="145" rx="14" fill="#E1ECF0"/><text x="92" y="254" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#14343C" text-anchor="start">One shared sensory core</text><text x="92" y="293.0" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#14343C" text-anchor="start">Front + Gripper images and body feedback</text><text x="92" y="322.7" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#14343C" text-anchor="start">Same fixed sensory mapping and calibration</text><rect x="870" y="215" width="460" height="145" rx="14" fill="#E9E6DD"/><text x="892" y="254" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#14343C" text-anchor="start">Observed finger contacts</text><text x="892" y="293.0" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#14343C" text-anchor="start">Both contact flags true → holding weights</text><text x="892" y="322.7" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#14343C" text-anchor="start">Otherwise → pickup weights</text><rect x="70" y="418" width="550" height="145" rx="14" fill="#FFE5B9"/><text x="92" y="457" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#14343C" text-anchor="start">Stored pickup weights</text><text x="92" y="496.0" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#14343C" text-anchor="start">direct-pickup-20260912</text><text x="92" y="529.75" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#14343C" text-anchor="start">Fit using the unheld training subset</text><rect x="780" y="418" width="550" height="145" rx="14" fill="#FFE5B9"/><text x="802" y="457" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#14343C" text-anchor="start">Stored holding weights</text><text x="802" y="496.0" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#14343C" text-anchor="start">level-hold-response-20260912</text><text x="802" y="529.75" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#14343C" text-anchor="start">Fit using the bilateral-contact training subset</text><path d="M1100,360 L1100,391 L700,391 L700,590" fill="none" stroke="#527985" stroke-width="3" stroke-linejoin="round" marker-end="url(#a)"/><path d="M620,490 L680,490 L680,590" fill="none" stroke="#AC6826" stroke-width="3" stroke-linejoin="round" marker-end="url(#b)"/><path d="M780,490 L720,490 L720,590" fill="none" stroke="#AC6826" stroke-width="3" stroke-linejoin="round" marker-end="url(#b)"/><rect x="615" y="600" width="170" height="76" rx="14" fill="#E9E6DD"/><text x="700" y="647" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#14343C" text-anchor="middle">SELECT</text><path d="M310,360 L310,385 L36,385 L36,788 L68,788" fill="none" stroke="#527985" stroke-width="3" stroke-linejoin="round" marker-end="url(#a)"/><rect x="80" y="723" width="1250" height="150" rx="14" fill="#E1ECF0"/><text x="102" y="762" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#14343C" text-anchor="start">One shared learned motor route</text><text x="102" y="801.0" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#14343C" text-anchor="start">The selected bank supplies MBON input weights/offsets and motor-input strengths.</text><text x="102" y="833.4" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#14343C" text-anchor="start">The cells, fixed pathways and seven-channel readout are shared. This is not two brains running in parallel.</text><path d="M700,676 L700,713" fill="none" stroke="#AC6826" stroke-width="3" stroke-linejoin="round" marker-end="url(#b)"/><text x="80" y="924" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#14343C" text-anchor="start">The contact selector is an engineered rule. Seven motor commands still come from the neural route.</text><rect x="70" y="970" width="1260" height="394" rx="14" fill="#E9E6DD"/><text x="94" y="1012" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#14343C" text-anchor="start">Offline training: images are used, through cached neural features</text><rect x="94" y="1046" width="360" height="154" rx="14" fill="#E1ECF0"/><text x="116" y="1085" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#14343C" text-anchor="start">1  Record on the Mac</text><text x="116" y="1124.0" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#14343C" text-anchor="start">Rendered RGB + body feedback</text><text x="116" y="1152.35" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#14343C" text-anchor="start">Separate teacher-state records</text><text x="116" y="1180.7" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#14343C" text-anchor="start">6,967 records / 122 episodes</text><rect x="514" y="1046" width="340" height="154" rx="14" fill="#E1ECF0"/><text x="536" y="1085" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#14343C" text-anchor="start">2  Create supervision</text><text x="536" y="1124.0" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#14343C" text-anchor="start">Teacher geometry + IK targets</text><text x="536" y="1153.7" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#14343C" text-anchor="start">Train / validation / test</text><text x="536" y="1183.4" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#14343C" text-anchor="start">Only training rows fit weights</text><rect x="914" y="1046" width="392" height="154" rx="14" fill="#FFE5B9"/><text x="936" y="1085" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#14343C" text-anchor="start">3  Fit response weights</text><text x="936" y="1124.0" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#14343C" text-anchor="start">Neural features + teacher targets</text><text x="936" y="1155.05" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#14343C" text-anchor="start">PyTorch: MPS / RTX 4090 CUDA</text><text x="936" y="1186.1" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#14343C" text-anchor="start">Fixed topology and output map</text><path d="M454,1123 L504,1123" fill="none" stroke="#527985" stroke-width="3" stroke-linejoin="round" marker-end="url(#a)"/><path d="M854,1123 L904,1123" fill="none" stroke="#527985" stroke-width="3" stroke-linejoin="round" marker-end="url(#a)"/><path d="M274,1200 L274,1240 L1110,1240 L1110,1204" fill="none" stroke="#527985" stroke-width="3" stroke-linejoin="round" marker-end="url(#a)"/><text x="515" y="1229" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#526A70" text-anchor="start">cached neural features</text><text x="96" y="1290.0" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#14343C" text-anchor="start">Counts include training, validation and test records. The teacher supplies geometry-based targets.</text><text x="96" y="1322.4" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#14343C" text-anchor="start">The policy receives images and robot feedback; native simulator trials decide deployment.</text><rect x="70" y="1402" width="1260" height="166" rx="14" fill="#E1ECF0"/><text x="94" y="1444" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#14343C" text-anchor="start">Dopamine: distinguish activity display from biological learning</text><text x="94" y="1486.0" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#14343C" text-anchor="start">Offline fits use teacher-loss gradients with a fixed dopamine multiplier.</text><text x="94" y="1519.75" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#14343C" text-anchor="start">Run-time rewards update the simulated dopamine display; default evaluation keeps weights fixed.</text><text x="94" y="1553.5" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#14343C" text-anchor="start">Touch-selected response banks currently require offline training.</text><text x="70" y="1633" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#526A70" text-anchor="start">Snapshot: 12 Sep 2026 · 13:27 PDT  ·  Code and completed-run evidence: sources.md</text><text x="70" y="1666" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#526A70" text-anchor="start">An engineering rate model derived from MaleCNS wiring. Biological fidelity is unvalidated.</text></svg>
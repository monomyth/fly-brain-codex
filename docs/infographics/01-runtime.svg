<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1700" viewBox="0 0 1400 1700"><title>How the configured controller moves the arm</title><desc>UI default: retain-grasp-20260911 · one learned response set · 20 mm cube · folded start</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#527985"/></marker><marker id="b" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#AC6826"/></marker></defs><rect width="1400" height="1700" fill="#F7F5EF"/><text x="70" y="61" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#526A70" text-anchor="start">MALECNS / REBOT     01 OF 03</text><text x="70" y="125" font-family="Arial, sans-serif" font-size="47" font-weight="700" fill="#14343C" text-anchor="start">How the configured controller moves the arm</text><text x="70" y="165.0" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#526A70" text-anchor="start">UI default: retain-grasp-20260911 · one learned response set · 20 mm cube · folded start</text><rect x="70" y="205" width="590" height="170" rx="14" fill="#E1ECF0"/><text x="92" y="244" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#14343C" text-anchor="start">Rendered camera views</text><text x="92" y="283.0" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#14343C" text-anchor="start">Front: Gemini 336L nominal RGB FOV</text><text x="92" y="315.4" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#14343C" text-anchor="start">Gripper: Gemini 305 nominal RGB FOV</text><text x="92" y="347.8" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#14343C" text-anchor="start">Both RGB streams → luminance → R1–R6</text><rect x="700" y="205" width="630" height="170" rx="14" fill="#E1ECF0"/><text x="722" y="244" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#14343C" text-anchor="start">Simulated robot feedback</text><text x="722" y="283.0" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#14343C" text-anchor="start">Six joint angles, jaw opening, finger contacts</text><text x="722" y="315.4" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#14343C" text-anchor="start">Engineered stimulation of leg sensory cells</text><text x="722" y="347.8" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#14343C" text-anchor="start">Time drives integration; IDs guard resets/frames</text><path d="M365,375 L365,400" fill="none" stroke="#527985" stroke-width="3" stroke-linejoin="round" marker-end="url(#a)"/><path d="M1015,375 L1015,400" fill="none" stroke="#527985" stroke-width="3" stroke-linejoin="round" marker-end="url(#a)"/><rect x="70" y="410" width="1260" height="135" rx="14" fill="#E1ECF0"/><text x="92" y="449" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#14343C" text-anchor="start">Fixed sensory propagation · MLX / Metal</text><text x="92" y="488.0" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#14343C" text-anchor="start">Prepared graph: 167,124 nodes; 3,316 assigned retinal inputs. Separate persistent visual/body states.</text><text x="92" y="520.4" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#14343C" text-anchor="start">206 visual-side features + 59 ascending-body features = 265 normalized inputs.</text><path d="M700,545 L700,571 L225,571 L225,616" fill="none" stroke="#AC6826" stroke-width="3" stroke-linejoin="round" marker-end="url(#b)"/><text x="750" y="586" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#526A70" text-anchor="start">Learned motor response: NumPy + SciPy on CPU</text><rect x="70" y="625" width="310" height="164" rx="14" fill="#FFE5B9"/><text x="92" y="664" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#14343C" text-anchor="start">29 MBONs</text><text x="92" y="703.0" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#14343C" text-anchor="start">Mushroom-body outputs</text><text x="92" y="735.4" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#14343C" text-anchor="start">Fit input weights</text><text x="92" y="767.8" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#14343C" text-anchor="start">and response offsets</text><rect x="445" y="620" width="260" height="122" rx="14" fill="#E1ECF0"/><text x="467" y="659" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#14343C" text-anchor="start">4,977 relay nodes</text><text x="467" y="698.0" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#14343C" text-anchor="start">Central-brain pool</text><rect x="445" y="827" width="260" height="125" rx="14" fill="#E1ECF0"/><text x="467" y="866" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#14343C" text-anchor="start">1,129 descending</text><text x="467" y="905.0" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#14343C" text-anchor="start">neurons / nodes</text><rect x="800" y="659" width="250" height="125" rx="14" fill="#E1ECF0"/><text x="822" y="698" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#14343C" text-anchor="start">1,995 premotor</text><text x="822" y="737.0" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#14343C" text-anchor="start">neurons / nodes</text><rect x="1080" y="827" width="250" height="164" rx="14" fill="#FFE5B9"/><text x="1102" y="866" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#14343C" text-anchor="start">75 motor neurons</text><text x="1102" y="905.0" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#14343C" text-anchor="start">Fit input strengths</text><text x="1102" y="936.05" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#14343C" text-anchor="start">from DN + premotor</text><text x="1102" y="967.1" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#14343C" text-anchor="start">Existing edges only</text><path d="M380,679 L436,679" fill="none" stroke="#527985" stroke-width="3" stroke-linejoin="round" marker-end="url(#a)"/><path d="M380,747 L408,747 L408,885 L436,885" fill="none" stroke="#527985" stroke-width="3" stroke-linejoin="round" marker-end="url(#a)"/><path d="M575,742 L575,817" fill="none" stroke="#527985" stroke-width="3" stroke-linejoin="round" marker-end="url(#a)"/><path d="M705,850 L750,850 L750,721 L790,721" fill="none" stroke="#527985" stroke-width="3" stroke-linejoin="round" marker-end="url(#a)"/><path d="M705,916 L1070,916" fill="none" stroke="#AC6826" stroke-width="3" stroke-linejoin="round" marker-end="url(#b)"/><path d="M1050,721 L1205,721 L1205,817" fill="none" stroke="#AC6826" stroke-width="3" stroke-linejoin="round" marker-end="url(#b)"/><text x="75" y="875" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#526A70" text-anchor="start">Blue: fixed pathways</text><text x="75" y="911" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#AC6826" text-anchor="start">Amber: fitted inputs</text><path d="M1205,991 L1205,1024 L314,1024 L314,1060" fill="none" stroke="#527985" stroke-width="3" stroke-linejoin="round" marker-end="url(#a)"/><rect x="70" y="1070" width="490" height="150" rx="14" fill="#E9E6DD"/><text x="92" y="1109" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#14343C" text-anchor="start">Fixed muscle-pool readout</text><text x="92" y="1148.0" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#14343C" text-anchor="start">Engineering mapping from leg-motor pools</text><text x="92" y="1179.05" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#14343C" text-anchor="start">75 motor rates → seven control scores</text><path d="M560,1135 L662,1135" fill="none" stroke="#527985" stroke-width="3" stroke-linejoin="round" marker-end="url(#a)"/><rect x="673" y="1070" width="657" height="150" rx="14" fill="#E9E6DD"/><text x="695" y="1109" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#14343C" text-anchor="start">Commands · nominal 2 Hz</text><text x="695" y="1148.0" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#14343C" text-anchor="start">Six joint targets (degrees) + jaw aperture (mm)</text><text x="695" y="1180.4" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#14343C" text-anchor="start">Local Unix socket → native control tools</text><text x="695" y="1212.8" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#14343C" text-anchor="start">Native rate / floor limits → RealityKit</text><text x="75" y="1254" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#14343C" text-anchor="start">RealityKit: kinematic arm + dynamic cube. The control tools are also exposed through MCP.</text><text x="75" y="1290" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#526A70" text-anchor="start">Each step returns new observations; the 3D overlay displays simulated neural activity.</text><rect x="70" y="1323" width="1260" height="245" rx="14" fill="#E9E6DD"/><text x="94" y="1362" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#14343C" text-anchor="start">Task completion is a separate, explicit control step</text><text x="94" y="1406.0" font-family="Arial, sans-serif" font-size="26" font-weight="400" fill="#14343C" text-anchor="start">Native evaluator requires: ≥100 mm cube clearance, ≤5° tilt and a stable ≥5 s hold.</text><text x="94" y="1441.1" font-family="Arial, sans-serif" font-size="26" font-weight="400" fill="#14343C" text-anchor="start">Then the runner keeps the reached joint pose, commands the jaw open to 90 mm,</text><text x="94" y="1476.2" font-family="Arial, sans-serif" font-size="26" font-weight="400" fill="#14343C" text-anchor="start">and verifies that the cube has landed. This opening/drop step is scripted.</text><text x="94" y="1534" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#526A70" text-anchor="start">Cube geometry is reserved for teacher supervision and evaluation, outside the neural policy.</text><text x="70" y="1633" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#526A70" text-anchor="start">Snapshot: 12 Sep 2026 · 13:27 PDT  ·  Code and completed-run evidence: sources.md</text><text x="70" y="1666" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#526A70" text-anchor="start">An engineering rate model derived from MaleCNS wiring. Biological fidelity is unvalidated.</text></svg>
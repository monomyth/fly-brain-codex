<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1700" viewBox="0 0 1400 1700"><title>What works — and what still fails</title><desc>Completed simulator evidence · 20 mm cube, folded start · larger-placement reliability remains unresolved</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#527985"/></marker><marker id="b" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#AC6826"/></marker></defs><rect width="1400" height="1700" fill="#F7F5EF"/><text x="70" y="61" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#526A70" text-anchor="start">MALECNS / REBOT     03 OF 03</text><text x="70" y="125" font-family="Arial, sans-serif" font-size="47" font-weight="700" fill="#14343C" text-anchor="start">What works — and what still fails</text><text x="70" y="165.0" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#526A70" text-anchor="start">Completed simulator evidence · 20 mm cube, folded start · larger-placement reliability remains unresolved</text><rect x="70" y="212" width="600" height="187" rx="14" fill="#E1ECF0"/><text x="92" y="251" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#14343C" text-anchor="start">Configured UI model: retain-grasp</text><text x="92" y="290.0" font-family="Arial, sans-serif" font-size="26" font-weight="400" fill="#14343C" text-anchor="start">19 / 20 passed pickup + hold on its small grid</text><text x="92" y="325.1" font-family="Arial, sans-serif" font-size="26" font-weight="400" fill="#14343C" text-anchor="start">X: 343–357 mm; Y: −10–8 mm</text><text x="92" y="360.2" font-family="Arial, sans-serif" font-size="26" font-weight="400" fill="#14343C" text-anchor="start">A separate normal-UI test verified hold + drop.</text><rect x="710" y="212" width="620" height="187" rx="14" fill="#E9E6DD"/><text x="732" y="251" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#14343C" text-anchor="start">Latest tested candidate: touch-direct</text><text x="732" y="290.0" font-family="Arial, sans-serif" font-size="26" font-weight="400" fill="#14343C" text-anchor="start">12 / 15 completed pickup + hold + drop</text><text x="732" y="325.1" font-family="Arial, sans-serif" font-size="26" font-weight="400" fill="#14343C" text-anchor="start">20 positions planned; stopped after 3 failures</text><text x="732" y="360.2" font-family="Arial, sans-serif" font-size="26" font-weight="400" fill="#14343C" text-anchor="start">5 remaining positions were not attempted.</text><text x="75" y="450" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#14343C" text-anchor="start">Latest candidate: actual floor placements and outcomes</text><text x="75" y="488" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#526A70" text-anchor="start">Different grids and completion criteria: the two scores above are not a head-to-head comparison.</text><path d="M211.42857142857142,556 V784.0" stroke="#CCD6D5" stroke-width="1"/><text x="211.42857142857142" y="821.0" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#526A70" text-anchor="middle">-30</text><path d="M455.71428571428567,556 V784.0" stroke="#CCD6D5" stroke-width="1"/><text x="455.71428571428567" y="821.0" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#526A70" text-anchor="middle">-15</text><path d="M700.0,556 V784.0" stroke="#CCD6D5" stroke-width="1"/><text x="700.0" y="821.0" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#526A70" text-anchor="middle">0</text><path d="M944.2857142857142,556 V784.0" stroke="#CCD6D5" stroke-width="1"/><text x="944.2857142857142" y="821.0" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#526A70" text-anchor="middle">15</text><path d="M1188.5714285714284,556 V784.0" stroke="#CCD6D5" stroke-width="1"/><text x="1188.5714285714284" y="821.0" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#526A70" text-anchor="middle">30</text><path d="M130,751.4285714285714 H1270" stroke="#CCD6D5" stroke-width="1"/><text x="110" y="759.4285714285714" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#526A70" text-anchor="end">345</text><path d="M130,670.0 H1270" stroke="#CCD6D5" stroke-width="1"/><text x="110" y="678.0" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#526A70" text-anchor="end">350</text><path d="M130,588.5714285714286 H1270" stroke="#CCD6D5" stroke-width="1"/><text x="110" y="596.5714285714286" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#526A70" text-anchor="end">355</text><text x="82" y="541" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#526A70" text-anchor="start">X mm</text><text x="700" y="861.0" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#526A70" text-anchor="middle">Cube Y (sideways), mm</text><circle cx="700.0" cy="670.0" r="12" fill="#197452"/><path d="M200.42857142857142,740.4285714285714 L222.42857142857142,762.4285714285714 M222.42857142857142,740.4285714285714 L200.42857142857142,762.4285714285714" stroke="#B04738" stroke-width="5"/><text x="232.42857142857142" y="737.4285714285714" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#B04738" text-anchor="start">1</text><circle cx="455.71428571428567" cy="751.4285714285714" r="12" fill="#197452"/><circle cx="700.0" cy="751.4285714285714" r="12" fill="#197452"/><circle cx="944.2857142857142" cy="751.4285714285714" r="12" fill="#197452"/><circle cx="1188.5714285714284" cy="751.4285714285714" r="12" fill="#197452"/><path d="M200.42857142857142,659.0 L222.42857142857142,681.0 M222.42857142857142,659.0 L200.42857142857142,681.0" stroke="#B04738" stroke-width="5"/><text x="232.42857142857142" y="656.0" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#B04738" text-anchor="start">2</text><circle cx="455.71428571428567" cy="670.0" r="12" fill="#197452"/><circle cx="944.2857142857142" cy="670.0" r="12" fill="#197452"/><circle cx="1188.5714285714284" cy="670.0" r="12" fill="#197452"/><circle cx="211.42857142857142" cy="588.5714285714286" r="12" fill="#197452"/><circle cx="455.71428571428567" cy="588.5714285714286" r="12" fill="#197452"/><circle cx="700.0" cy="588.5714285714286" r="12" fill="#197452"/><circle cx="944.2857142857142" cy="588.5714285714286" r="12" fill="#197452"/><path d="M1177.5714285714284,577.5714285714286 L1199.5714285714284,599.5714285714286 M1199.5714285714284,577.5714285714286 L1177.5714285714284,599.5714285714286" stroke="#B04738" stroke-width="5"/><text x="1209.5714285714284" y="574.5714285714286" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#B04738" text-anchor="start">3</text><circle cx="292.85714285714283" cy="718.8571428571429" r="11" fill="#F7F5EF" stroke="#8B9697" stroke-width="3"/><circle cx="1107.142857142857" cy="718.8571428571429" r="11" fill="#F7F5EF" stroke="#8B9697" stroke-width="3"/><circle cx="292.85714285714283" cy="621.1428571428571" r="11" fill="#F7F5EF" stroke="#8B9697" stroke-width="3"/><circle cx="1107.142857142857" cy="621.1428571428571" r="11" fill="#F7F5EF" stroke="#8B9697" stroke-width="3"/><circle cx="781.4285714285713" cy="670.0" r="11" fill="#F7F5EF" stroke="#8B9697" stroke-width="3"/><text x="130" y="905" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#197452" text-anchor="start">● 12 complete</text><text x="490" y="905" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#B04738" text-anchor="start">× 3 failed</text><text x="800" y="905" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#8B9697" text-anchor="start">○ 5 not attempted</text><rect x="70" y="960" width="400" height="200" rx="14" fill="#F5E0DA"/><text x="90" y="1000" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#B04738" text-anchor="start">1  No grasp</text><text x="90" y="1046.0" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#14343C" text-anchor="start">Cube [345, −30] mm</text><text x="90" y="1077.05" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#14343C" text-anchor="start">Never registered a grasp.</text><text x="90" y="1108.1" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#14343C" text-anchor="start">Stopped at the decision limit.</text><rect x="500" y="960" width="400" height="200" rx="14" fill="#F5E0DA"/><text x="520" y="1000" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#B04738" text-anchor="start">2  Hold not qualified</text><text x="520" y="1046.0" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#14343C" text-anchor="start">Cube [350, −30] mm</text><text x="520" y="1077.05" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#14343C" text-anchor="start">Grasped; final clearance 117.4 mm.</text><text x="520" y="1108.1" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#14343C" text-anchor="start">Final tilt 7.48° exceeds 5°.</text><rect x="930" y="960" width="400" height="200" rx="14" fill="#F5E0DA"/><text x="950" y="1000" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#B04738" text-anchor="start">3  Grasp lost</text><text x="950" y="1046.0" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#14343C" text-anchor="start">Cube [355, +30] mm</text><text x="950" y="1077.05" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#14343C" text-anchor="start">Cube dropped and tipped.</text><text x="950" y="1108.1" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#14343C" text-anchor="start">Final tilt was about 90°.</text><rect x="70" y="1205" width="1260" height="175" rx="14" fill="#E1ECF0"/><text x="94" y="1246" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#14343C" text-anchor="start">Implemented and demonstrated</text><text x="94" y="1288.0" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#14343C" text-anchor="start">UI Run/Reset, cube placement, both camera views, neural motor commands and the activity overlay.</text><text x="94" y="1321.75" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#14343C" text-anchor="start">Release works after a qualifying hold. If the hold never qualifies, the completion drop is not triggered.</text><rect x="70" y="1415" width="1260" height="170" rx="14" fill="#E9E6DD"/><text x="94" y="1456" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#14343C" text-anchor="start">Still outside the evidence</text><text x="94" y="1498.0" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#14343C" text-anchor="start">Reliable pickup across arbitrary floor positions and other cube sizes remains unproven.</text><text x="94" y="1529.05" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#14343C" text-anchor="start">UI deployment gate: 18/20 qualifying trials; this candidate has not met that requirement.</text><text x="94" y="1560.1" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#14343C" text-anchor="start">The 12,000-iteration RTX 4090 fit finished; simulator validation is pending.</text><text x="70" y="1633" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#526A70" text-anchor="start">Snapshot: 12 Sep 2026 · 13:27 PDT  ·  Code and completed-run evidence: sources.md</text><text x="70" y="1666" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#526A70" text-anchor="start">An engineering rate model derived from MaleCNS wiring. Biological fidelity is unvalidated.</text></svg>